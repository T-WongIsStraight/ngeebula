<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f1f4f8" />
    <meta
      name="description"
      content="Plans which contractor works on which stretch of track, each week, without breaking a safety rule."
    />
    <title>Track Access Scheduler</title>
    <script>
      // Pick the theme before the first paint so the page never flashes white
      // at 2 AM. The toggle keeps this key in sync.
      (function () {
        try {
          var saved = localStorage.getItem("tas-theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.querySelector('meta[name="theme-color"]').content = dark ? "#0f1115" : "#f1f4f8";
        } catch (e) {
          /* leave the light default */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
